<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inspección Vehicular - DOMINION</title>

<!-- Configuración PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1240B3">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png">

<style>
  :root{
    --bg:#F5F4F1;
    --paper:#FFFFFF;
    --ink:#1E2A32;
    --ink-soft:#5B6670;
    --accent:#1240B3;
    --line:#D7D3CB;
    --slot-bg:#EFEDE8;
    --bueno:#3F6B4F;
    --regular:#B07B12;
    --malo:#A13A0C;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .app{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--accent);padding-bottom:16px;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
  header.top h1{font-size:22px;margin:0 0 4px;letter-spacing:-0.01em;color:var(--accent);}
  header.top p{margin:0;color:var(--ink-soft);font-size:13px;max-width:560px;}
  .btn{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 14px;font-size:13px;border-radius:3px;cursor:pointer;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn.primary:hover{background:#0e328f;}
  .btn.small{padding:5px 9px;font-size:12px;}
  .btn.danger{border-color:#8a2e12;color:#8a2e12;background:transparent;}
  .btn.danger:hover{background:#8a2e12;color:#fff;}
  .btn.upload{position:relative;overflow:hidden;display:inline-block;}
  .btn.upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .veh-toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;}
  .veh-toolbar .veh-title{font-size:13px;font-weight:600;color:var(--ink-soft);}

  .sheet{
    background:var(--paper);
    width:100%;
    max-width:820px;
    height:1050px;
    margin:0 auto 18px;
    box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);
    padding:24px 28px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .sheet-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:10px;}
  .sheet-head .brand-logo{font-size:24px;font-weight:800;color:var(--accent);letter-spacing:0.05em;margin:0;}
  .sheet-head .brand{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);text-align:right;}
  .sheet-head .brand strong{color:var(--accent);display:block;font-size:14px;letter-spacing:0;}

  .ficha{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px;margin-bottom:12px;font-size:12px;}
  .ficha .f{display:flex;flex-direction:column;gap:2px;}
  .ficha label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;}
  .ficha input{border:none;border-bottom:1px solid var(--line);padding:3px 0;font-size:12px;font-family:inherit;background:transparent;color:var(--ink);}
  .ficha input:focus{outline:none;border-color:var(--accent);}

  .checklist{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px;}
  .checklist th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding:4px 6px;}
  .checklist td{border-bottom:1px solid var(--line);padding:3px 6px;vertical-align:top;}
  .checklist td.item{width:22%;font-weight:600;}
  .checklist td.estado{width:16%;}
  .checklist select{width:100%;border:1px solid var(--line);border-radius:2px;font-size:11px;padding:2px 4px;font-family:inherit;background:#fff;}
  .checklist input.obs{width:100%;border:none;border-bottom:1px solid transparent;font-size:11.5px;font-family:inherit;background:transparent;padding:2px 0;}
  .checklist input.obs:focus{outline:none;border-color:var(--accent);}

  .summary-bar{display:flex;gap:12px;margin:6px 0 10px;padding:6px 10px;background:var(--slot-bg);border-radius:4px;font-size:11px;}
  .summary-bar span{font-weight:600;}

  .print-val{display:none;}

  .estado-tag{font-size:10px;padding:1px 6px;border-radius:2px;color:#fff;}
  .estado-tag.bueno{background:var(--bueno);}
  .estado-tag.regular{background:var(--regular);}
  .estado-tag.malo{background:var(--malo);}

  .obs-generales label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);display:block;margin-bottom:3px;font-weight:600;}
  .obs-generales textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:8px;font-size:12px;font-family:inherit;resize:vertical;min-height:50px;color:var(--ink);}

  .signatures{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:auto;padding-top:10px;}
  .sig-box{border-top:1px solid var(--line);text-align:center;padding-top:4px;font-size:10px;color:var(--ink-soft);}

  .footnote{margin-top:8px;padding-top:8px;font-size:10px;color:var(--ink-soft);display:flex;justify-content:space-between;border-top:1px solid var(--line);}

  .photo-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:12px;
    flex:1;
    height:100%;
    min-height:0;
    margin-bottom:10px;
  }
  .slot{
    background:var(--slot-bg);
    border:1px solid var(--line);
    border-radius:3px;
    position:relative;
    overflow:hidden;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .slot .remove{position:absolute;top:5px;right:5px;background:rgba(30,42,50,.75);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;line-height:1;}
  .slot .tag{position:absolute;bottom:5px;left:5px;background:rgba(30,42,50,.75);color:#fff;font-size:10px;padding:2px 6px;border-radius:2px;}
  .slot.empty{display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;border-style:dashed;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:6px;background:var(--paper);}
  .vehicle-block{border-top:3px solid var(--accent);padding-top:16px;margin-top:24px;}
  .vehicle-block:first-child{border-top:none;margin-top:0;padding-top:0;}

  /* Estilos para PDF e Impresión */
  @media print{
    body{background:#fff;color:#000;}
    .no-print{display:none !important;}
    .app{max-width:none;padding:0;margin:0;}
    
    .sheet{
      box-shadow:none;
      margin:0;
      width:100% !important;
      height:100vh !important;
      padding:10mm !important;
      page-break-after:always;
      break-after:page;
      break-inside:avoid;
    }

    .photo-grid{
      height:calc(100% - 60px) !important;
    }

    .vehicle-block{border-top:none;margin-top:0;padding-top:0;}
    .slot{border-style:solid;}
    .slot.empty{display:none;}
    input, textarea, select{border:none !important;outline:none !important;background:transparent !important;}
    select, .no-print-input{display:none !important;}
    .print-val{display:inline-block !important;}
    
    @page{
      size:letter portrait;
      margin:0;
    }
  }
</style>
</head>

<div class="app">

    <div>
      <h1>Inspección Vehicular - DOMINION</h1>
      <p>Reportes de inspección vehicular offline con exportación a PDF.</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" id="addVehicleBtn">+ Agregar vehículo</button>
      <button class="btn" id="saveLocalBtn">Guardar Borrador</button>

<script>
const MASTER_DATA = [
  { placa: "GUR035", conductor: "KARIN ANTONIO LOBELO BALDIRIS", cc: "9103263" },
  { placa: "LLL406", conductor: "PAJARO RODRIGUEZ OSCAR DAVID", cc: "1047484724" },
  { placa: "LLL407", conductor: "CESAR ANDRES RUIZ CASTRO", cc: "1143336347" },
  { placa: "LWL753", conductor: "LUIS ALFREDO FERNANDEZ RAMOS", cc: "1001970886" },
  { placa: "NUZ356", conductor: "ANGEL LUCIO GALAN ARRIETA", cc: "9157251" },
  { placa: "NUZ359", conductor: "MILTON ENRIQUE RICO RODRIGUEZ", cc: "1047452552" },
  { placa: "NZT104", conductor: "HERNANDEZ DE LA ROSA CESAR AUGUSTO", cc: "9147023" },
  { placa: "PRZ128", conductor: "JORGE MARIO GONZALEZ VELASCO", cc: "73009817" },
  { placa: "QJX522", conductor: "", cc: "" },
  { placa: "QOM452", conductor: "WALTER RAMOS ESPINOZA", cc: "1050946527" },
  { placa: "QOM455", conductor: "HEYNER FERNANDO POLO ARELLANO", cc: "1047400370" },
  { placa: "QOM467", conductor: "JHAN CARLOS MONTES MANJARREZ", cc: "1002195092" },
  { placa: "QOM470", conductor: "RONALD ALBERTO GONZALEZ VENERA", cc: "1047473954" },
  { placa: "LUK993", conductor: "FIDEL ANTONIO LOBO", cc: "1071349730" },
  { placa: "LUL022", conductor: "NEVER DE JESUS SALGADO", cc: "78750367" },
  { placa: "LLL382", conductor: "CARLOS BLAS OVIEDO NARVAEZ", cc: "1102836762" },
  { placa: "LLL396", conductor: "HERNANDO MANUEL TAMARA LOPEZ", cc: "92532788" },
  { placa: "LSO539", conductor: "LUIS FERNANDO PEREZ FERNANDEZ", cc: "1067931536" },
  { placa: "NZT124", conductor: "CANEDO CARVAJAL CLAMER", cc: "1067918214" },
  { placa: "JTY741", conductor: "YEISON MANUEL HERNANDEZ", cc: "1007764039" },
  { placa: "KOK287", conductor: "CAUSIL HOYOS EMELDO GABRIEL", cc: "11002291" }
];

const CHECKLIST_ITEMS = ['Luces','Llantas','Frenos','Extintor','Botiquín','Carrocería','Espejos','Documentación','Aceite','Batería'];
const ESTADOS = ['Bueno','Regular','Malo'];
const PHOTOS_PER_PAGE = 4;

let vehicles = [];
let counter = 0;

function newVehicle(){
  return {
    id: ++counter,
    fecha: new Date().toISOString().split('T')[0],
    inspector:'', vehiculoLinea:'', placa:'', conductor:'', ccConductor:'', km:'', extintor:'',
    checklist: CHECKLIST_ITEMS.map(item => ({item, estado:'Bueno', obs:'sin novedad'})),
    observacionesGenerales:'',
    photos: []
  };
}

function addVehicle(){ 
  vehicles.push(newVehicle()); 
  render(); 
}

function removeVehicle(id){ 
  if(confirm("¿Estás seguro de eliminar este vehículo?")){
    vehicles = vehicles.filter(v=>v.id!==id); 
    render(); 
  }
}

function getV(id){ return vehicles.find(v=>v.id===id); }

function updateField(id, key, value){
  const v = getV(id);
  if(!v) return;
  v[key] = value;

  if(key === 'placa'){
    const found = MASTER_DATA.find(m => m.placa.toUpperCase() === value.trim().toUpperCase());
    if(found){
      if(found.conductor) v.conductor = found.conductor;
      if(found.cc) v.ccConductor = found.cc;
      render();
      return;
    }
  } else if(key === 'conductor'){
    const found = MASTER_DATA.find(m => m.conductor.toUpperCase() === value.trim().toUpperCase());
    if(found){
      if(found.placa) v.placa = found.placa;
      if(found.cc) v.ccConductor = found.cc;
      render();
      return;
    }
  }

  if(key === 'placa' || key === 'fecha' || key === 'vehiculoLinea'){
    const titleEl = document.getElementById(`title-veh-${id}`);
    if(titleEl) titleEl.innerText = `Vehículo - ${v.placa || 'sin placa'}`;
  }
}

function updateChecklistEstado(id, idx, value){ 
  const v = getV(id); 
  if(v){
    v.checklist[idx].estado = value;
    renderSummary(id);
    const tagEl = document.getElementById(`tag-${id}-${idx}`);
    if(tagEl){
      tagEl.className = `estado-tag ${estadoClass(value)}`;
      tagEl.innerText = value;
    }
  }
}

function updateChecklistObs(id, idx, value){ 
  const v = getV(id); 
  if(v) v.checklist[idx].obs = value; 
}

function renderSummary(id){
  const v = getV(id);
  if(!v) return;
  const counts = { Bueno: 0, Regular: 0, Malo: 0 };
  v.checklist.forEach(c => counts[c.estado] = (counts[c.estado] || 0) + 1);
  const sumEl = document.getElementById(`summary-${id}`);
  if(sumEl){
    sumEl.innerHTML = `
      <span>Resumen de inspección:</span>
      <span style="color:var(--bueno)">Bueno: ${counts.Bueno}</span> | 
      <span style="color:var(--regular)">Regular: ${counts.Regular}</span> | 
      <span style="color:var(--malo)">Malo: ${counts.Malo}</span>
    `;
  }
}

function handlePhotos(id, files){
  const v = getV(id);
  if(!v || !files || !files.length) return;
  let pending = files.length;
  Array.from(files).forEach(file=>{
    const reader = new FileReader();
    reader.onload = e => {
      v.photos.push(e.target.result);
      pending--;
      if(pending===0) render();
    };
    reader.readAsDataURL(file);
  });
}

function removePhoto(id, photoIdx){
  const v = getV(id);
  if(v){ 
    v.photos.splice(photoIdx,1); 
    render(); 
  }
}

function fmtFecha(f){
  if(!f) return '';
  const [y,m,d] = f.split('-');
  return `${d}/${m}/${y}`;
}

function estadoClass(e){
  return e==='Bueno' ? 'bueno' : e==='Regular' ? 'regular' : 'malo';
}

function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}

function saveLocal(){
  localStorage.setItem('inspeccion_vehiculos_dominion_data', JSON.stringify(vehicles));
  alert('Borrador guardado exitosamente.');
}

function loadLocal(){
  const data = localStorage.getItem('inspeccion_vehiculos_dominion_data');
  if(data){
    try {
      vehicles = JSON.parse(data);
      counter = vehicles.reduce((max, v) => v.id > max ? v.id : max, 0);
    } catch(e) {
      vehicles = [];
    }
  }
}

function render(){
  const container = document.getElementById('sheets');
  document.getElementById('emptyState').style.display = vehicles.length ? 'none' : 'block';

  container.innerHTML = vehicles.map((v, vIdx) => {

    const counts = { Bueno: 0, Regular: 0, Malo: 0 };
    v.checklist.forEach(c => counts[c.estado] = (counts[c.estado] || 0) + 1);

    const dataSheet = `
      <div class="sheet">
        <div class="sheet-head">
          <div class="brand-logo">DOMINION</div>
          <div class="brand">
            <strong>INSPECCIÓN VEHICULAR</strong>
            Vehículo ${vIdx+1} de ${vehicles.length}
          </div>
        </div>

        <div class="ficha">
          <div class="f"><label>Fecha inspección</label><input type="date" value="${v.fecha}" onchange="updateField(${v.id},'fecha',this.value)"></div>
          <div class="f"><label>Placa</label><input list="placas-list" value="${v.placa || ''}" onchange="updateField(${v.id},'placa',this.value)"></div>
          <div class="f"><label>Vehículo / Línea</label><input value="${v.vehiculoLinea || ''}" oninput="updateField(${v.id},'vehiculoLinea',this.value)"></div>
          <div class="f"><label>Conductor</label><input list="conductores-list" value="${v.conductor || ''}" onchange="updateField(${v.id},'conductor',this.value)"></div>
          <div class="f"><label>C.C. Conductor</label><input value="${v.ccConductor || ''}" oninput="updateField(${v.id},'ccConductor',this.value)"></div>
          <div class="f"><label>Kilometraje</label><input value="${v.km || ''}" oninput="updateField(${v.id},'km',this.value)"></div>
          <div class="f"><label>Inspector</label><input value="${v.inspector || ''}" oninput="updateField(${v.id},'inspector',this.value)"></div>
          <div class="f"><label>Vencimiento Extintor</label><input type="date" value="${v.extintor || ''}" onchange="updateField(${v.id},'extintor',this.value)"></div>
        </div>

        <div class="summary-bar" id="summary-${v.id}">
          <span>Resumen de inspección:</span>
          <span style="color:var(--bueno)">Bueno: ${counts.Bueno}</span> | 
          <span style="color:var(--regular)">Regular: ${counts.Regular}</span> | 
          <span style="color:var(--malo)">Malo: ${counts.Malo}</span>
        </div>

        <table class="checklist">
          <thead><tr><th>Ítem</th><th>Estado</th><th>Observaciones</th></tr></thead>
          <tbody>
            ${v.checklist.map((c,idx)=>`
              <tr>
                <td class="item">${c.item}</td>
                <td class="estado">
                  <select class="no-print-input" onchange="updateChecklistEstado(${v.id},${idx},this.value)">
                    ${ESTADOS.map(e=>`<option value="${e}" ${e===c.estado?'selected':''}>${e}</option>`).join('')}
                  </select>
                  <span id="tag-${v.id}-${idx}" class="estado-tag ${estadoClass(c.estado)} print-val">${c.estado}</span>
                </td>
                <td><input class="obs" value="${c.obs || ''}" oninput="updateChecklistObs(${v.id},${idx},this.value)"></td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="obs-generales">
          <label>Observaciones generales</label>
          <textarea maxlength="500" oninput="updateField(${v.id},'observacionesGenerales',this.value)">${v.observacionesGenerales || ''}</textarea>
        </div>

        <div class="signatures">
          <div class="sig-box">
            <br><br>
            Firma del Inspector
          </div>
          <div class="sig-box">
            <br><br>
            Firma del Conductor
          </div>
        </div>

        <div class="footnote">
          <span>Placa: ${v.placa || '—'} · Conductor: ${v.conductor || '—'}</span>
          <span>Página 1</span>
        </div>
      </div>
    `;

    const photoChunks = chunk(v.photos, PHOTOS_PER_PAGE);
    const chunksToRender = photoChunks.length ? photoChunks : [[]];

    const photoSheets = chunksToRender.map((group, gIdx) => {
      const slots = [];
      for(let i=0;i<PHOTOS_PER_PAGE;i++){
        const photoIdx = gIdx*PHOTOS_PER_PAGE + i;
        const src = group[i];
        if(src){
          slots.push(`
            <div class="slot">
              <img src="${src}">
              <span class="tag">Foto ${photoIdx+1}</span>
              <button class="remove no-print" onclick="removePhoto(${v.id},${photoIdx})">×</button>
            </div>
          `);
        } else {
          slots.push(`<div class="slot empty no-print">Sin foto</div>`);
        }
      }
      return `
        <div class="sheet">
          <div class="sheet-head">
            <div class="brand-logo">DOMINION</div>
            <div class="brand">
              <strong>REGISTRO FOTOGRÁFICO</strong>
              Vehículo ${vIdx+1} de ${vehicles.length}
            </div>
          </div>
          <div class="photo-grid">${slots.join('')}</div>
          <div class="footnote">
            <span>Placa: ${v.placa || '—'}</span>
            <span>Registro fotográfico ${gIdx+1} de ${chunksToRender.length}</span>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="vehicle-block">
        <div class="veh-toolbar no-print">
          <span class="veh-title" id="title-veh-${v.id}">Vehículo ${vIdx+1} — ${v.placa || 'sin placa'}</span>
          <div style="display:flex;gap:8px;">
            <label class="btn small upload">+ Agregar fotos
              <input type="file" accept="image/*" multiple onchange="handlePhotos(${v.id}, this.files); this.value='';">
            </label>
            <button class="btn small danger" onclick="removeVehicle(${v.id})">Eliminar vehículo</button>
          </div>
        </div>
        ${dataSheet}
        ${photoSheets}
      </div>
    `;
  }).join('');
}

document.getElementById('addVehicleBtn').addEventListener('click', addVehicle);
document.getElementById('saveLocalBtn').addEventListener('click', saveLocal);
document.getElementById('printBtn').addEventListener('click', () => {
  window.print();
});

// Registro de Service Worker para PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('Service Worker listo:', reg.scope))
      .catch((err) => console.log('Error PWA:', err));
  });
}

loadLocal();
if(vehicles.length === 0){
  addVehicle();
} else {
  render();
}
</script>
</body>
</html>
